[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0b1320"
secondaryBackgroundColor = "#132338"
codeBackgroundColor = "#080e18"
textColor = "#f1f7fe"
linkColor = "#38bdf8"
borderColor = "#1e3a5f"
codeTextColor = "#7dd3fc"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

greenColor = "#34d399"
redColor = "#f87171"
yellowColor = "#fbbf24"
orangeColor = "#fb923c"
blueColor = "#38bdf8"
violetColor = "#a78bfa"
grayColor = "#94a3b8"

chartCategoricalColors = [
    "#38bdf8",
    "#34d399",
    "#a78bfa",
    "#f472b6",
    "#fbbf24",
    "#60a5fa",
    "#fb923c",
    "#2dd4bf",
]

dataframeBorderColor = "#1e3a5f"
dataframeHeaderBackgroundColor = "#132338"
dataframeHeaderTextColor = "#f1f7fe"

[theme.sidebar]
backgroundColor = "#080e18"
secondaryBackgroundColor = "#101d2e"
codeBackgroundColor = "#080e18"
textColor = "#f1f7fe"
borderColor = "#1e3a5f"
primaryColor = "#38bdf8"

[server]
headless = true

